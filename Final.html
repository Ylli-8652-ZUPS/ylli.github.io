<title>数三错题本 · 考研数学三</title>
<style>
/* 莫兰迪色系：低饱和、带灰调 */
:root{
  --blue:#617079;
  --blue-dark:#4e5b61;
  --blue-soft:#7d8a90;
  --bg:#f0ede8;
  --card:#faf8f5;
  --line:#dedad3;
  --line-soft:#e9e5df;
  --fg:#45443f;
  --fg-2:#6d6a64;
  --muted:#8d8880;
  --gaoshu:#647455;
  --xiandai:#746985;
  --gailv:#9c6a41;
  --ok:#647455;
  --warn:#8a6a3c;
  --danger:#a1655d;
  --fill:#efece6;
  --fill-2:#f6f3ee;
  --r:14px;
  --r-sm:10px;
  --sh:0 1px 2px rgba(69,68,65,.06),0 4px 16px rgba(69,68,65,.05);
  /* 数学字体：优先取系统自带的数学衬线体，iOS 上落到 Times New Roman（斜体即传统数学体观感） */
  --math-font:"Latin Modern Math","STIX Two Math","Cambria Math","Asana Math","Cambria","Times New Roman",Times,"Songti SC",serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
  font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
button{font-family:inherit;font-size:inherit;color:inherit}
input,textarea,select{font-family:inherit;font-size:16px;color:var(--fg)}
svg{display:block}
.hide{display:none !important}

/* ---------- 顶栏 ---------- */
#topbar{
  position:sticky;top:0;z-index:30;background:var(--blue);color:#fff;
  padding:calc(env(safe-area-inset-top) + 10px) 12px 10px;
  display:flex;align-items:center;gap:8px;min-height:54px;
  box-shadow:0 1px 0 rgba(0,0,0,.06);
}
#topbar .tb-title{font-size:17px;font-weight:600;margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-left:4px}
#topbar .tb-sub{display:block;font-size:11px;font-weight:400;opacity:.7}

/* ---------- 主体 ---------- */
#main{
  padding:12px 12px calc(86px + env(safe-area-inset-bottom));
  max-width:1120px;margin:0 auto;
}
.page{display:none}
.page.active{display:block}
.cols{display:block}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:12px;margin-bottom:12px;box-shadow:var(--sh);
}
.card.tight{padding:10px}
.sec-title{display:flex;align-items:center;gap:8px;margin:2px 2px 10px;font-size:14px;font-weight:600;color:var(--fg)}
.sec-title .st-line{width:3px;height:14px;border-radius:2px;background:var(--blue);display:inline-block}
.sec-title .st-extra{margin-left:auto;font-size:12px;font-weight:400;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.tiny{font-size:11.5px}

.row{display:flex;align-items:center;gap:8px}
.row.wrap{flex-wrap:wrap}
.row .grow{flex:1;min-width:0}
.spacer{flex:1}

/* ---------- 按钮 ---------- */
.btn{
  min-height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--line);
  background:var(--card);color:var(--fg);display:inline-flex;align-items:center;justify-content:center;gap:6px;
  font-size:14.5px;cursor:pointer;user-select:none;
}
.btn:active{background:var(--fill)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:active{background:var(--blue-dark)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--fg-2)}
.btn.danger{color:var(--danger);border-color:#e3ccc7}
.btn.okline{color:var(--ok);border-color:#d5dcc9}
.btn.block{width:100%}
.btn.sm{min-height:36px;padding:0 10px;font-size:13px;border-radius:10px}
.btn[disabled]{opacity:.5;pointer-events:none}
.icon-btn{
  width:44px;height:44px;min-width:44px;border-radius:12px;border:0;background:transparent;
  display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:inherit;
}
.icon-btn:active{background:rgba(255,255,255,.14)}
.icon-btn.dark:active{background:var(--fill)}
.linkbtn{border:0;background:transparent;color:var(--blue);font-size:13.5px;padding:8px 4px;min-height:36px}

/* ---------- 表单 ---------- */
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;color:var(--fg-2);margin-bottom:6px;font-weight:500}
.input,.textarea,.select{
  width:100%;min-height:46px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;
  background:var(--card);outline:none;appearance:none;-webkit-appearance:none;
}
.textarea{min-height:96px;resize:vertical;line-height:1.5}
.select{background:var(--card);padding-right:34px}
.input:focus,.textarea:focus,.select:focus{border-color:var(--blue-soft)}
.field .hint{font-size:11.5px;color:var(--muted);margin-top:5px}
select.select{
  background-image:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='20' height='20' viewBox='0 0 24 24' fill='none' stroke='%2398948c' stroke-width='2' stroke-linecap='round'%3E%3Cpath d='M6 9l6 6 6-6'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 10px center;
}
.seg{display:flex;background:var(--fill);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;min-height:38px;border:0;background:transparent;border-radius:9px;font-size:13.5px;color:var(--fg-2)}
.seg button.on{background:var(--card);color:var(--fg);font-weight:600;box-shadow:0 1px 2px rgba(69,68,65,.08)}
.switch{display:inline-flex;align-items:center;gap:8px;min-height:44px;font-size:14px}
.switch .track{width:50px;height:30px;border-radius:15px;background:#d6d1c9;position:relative;transition:background .18s;flex:none}
.switch .knob{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .18s}
.switch.on .track{background:var(--ok)}
.switch.on .knob{transform:translateX(20px)}

/* ---------- 标签 / 芯片 ---------- */
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:11.5px;line-height:1.7;background:var(--fill);color:var(--fg-2);white-space:nowrap}
.chip.m-math{background:rgba(100,116,85,.14);color:var(--gaoshu)}
.chip.m-linalg{background:rgba(116,105,133,.14);color:var(--xiandai)}
.chip.m-prob{background:rgba(156,106,65,.15);color:var(--gailv)}
.chip.warn{background:rgba(138,106,60,.16);color:var(--warn)}
.chip.ok{background:rgba(100,116,85,.16);color:var(--ok)}
.chip.gray{background:var(--fill);color:var(--muted)}

/* ---------- 分组折叠 ---------- */
.group{border:1px solid var(--line);border-radius:var(--r);background:var(--card);margin-bottom:10px;overflow:hidden;box-shadow:var(--sh)}
.ghead{display:flex;align-items:center;gap:8px;min-height:48px;padding:8px 12px;width:100%;border:0;background:var(--card);text-align:left}
.ghead:active{background:var(--fill-2)}
.ghead .caret{transition:transform .2s;flex:none;color:var(--muted)}
.ghead.open .caret{transform:rotate(90deg)}
.ghead .gname{font-weight:600;font-size:14.5px}
.ghead .gnum{margin-left:auto;font-size:12px;color:var(--muted);flex:none}
.gbody{border-top:1px solid var(--line-soft)}
.subgroup .ghead{background:var(--fill-2);padding-left:12px}
.subgroup .ghead .gname{font-weight:500;font-size:14px}
.subgroup .gbody > .wq-wrap:first-child{border-top:0}

/* ---------- 错题卡片 ---------- */
.wq{padding:11px 12px;border-top:1px solid var(--line-soft);transition:opacity .18s}
.wq.done{opacity:.45}
.wq.done .wq-title{text-decoration:line-through}
.wq-top{display:flex;align-items:flex-start;gap:10px}
.cb{
  width:26px;height:26px;min-width:26px;border-radius:8px;border:2px solid #d3cec6;background:var(--card);
  display:flex;align-items:center;justify-content:center;padding:0;margin-top:1px;cursor:pointer;flex:none;
}
.cb .tick{opacity:0;color:#fff;display:flex;transition:opacity .15s}
.cb.on{background:var(--ok);border-color:var(--ok)}
.cb.on .tick{opacity:1}
.cb-hit{padding:9px 10px 9px 6px;margin:-9px -10px -9px -6px;display:flex;align-items:center;background:transparent;border:0;min-height:44px}
.wq-main{flex:1;min-width:0}
.wq-title{font-size:14.5px;font-weight:600;word-break:break-word}
.wq-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;align-items:center}
.wq-text{font-size:13px;color:var(--fg-2);margin-top:4px;word-break:break-word;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.wq-acts{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}
.wq-img{width:52px;height:52px;border-radius:8px;object-fit:cover;border:1px solid var(--line);flex:none;background:var(--fill)}
.due{font-size:11.5px;color:var(--warn)}

/* ---------- 列表行 ---------- */
.list-row{display:flex;align-items:center;gap:10px;padding:11px 12px;border-top:1px solid var(--line-soft);min-height:56px}
.list-row:first-child{border-top:0}
.list-row.tap:active{background:var(--fill-2)}
.list-row .lr-main{flex:1;min-width:0}
.list-row .lr-title{font-size:14px;font-weight:500;word-break:break-word}
.list-row .lr-sub{font-size:12px;color:var(--muted);margin-top:2px}
.empty{text-align:center;padding:30px 16px;color:var(--muted)}
.empty svg{margin:0 auto 10px;color:#cfc9c0}
.empty .e-title{font-size:15px;color:var(--fg-2);font-weight:600;margin-bottom:4px}

/* ---------- 进度条 ---------- */
.bar{height:8px;border-radius:5px;background:var(--fill);overflow:hidden}
.bar > i{display:block;height:100%;border-radius:5px;background:var(--blue);transition:width .3s}
.progress-line{display:flex;align-items:center;gap:8px;margin-top:6px}
.progress-line .bar{flex:1}

/* ---------- 练习卡 ---------- */
.ex{border-top:1px dashed var(--line);padding:10px 0 4px}
.ex + .ex{padding-top:10px}
.ex-q{font-size:14px;white-space:pre-wrap;word-break:break-word}
.ex-a{background:#f1f3ec;border-left:3px solid var(--ok);padding:8px 10px;border-radius:0 8px 8px 0;font-size:13.5px;margin-top:8px;white-space:pre-wrap}
.ex-h{background:#f3f1f4;border-left:3px solid var(--xiandai);padding:8px 10px;border-radius:0 8px 8px 0;font-size:13.5px;margin-top:8px;white-space:pre-wrap}

/* ---------- 数学公式渲染（本地轻量实现，不依赖 MathJax / CDN） ---------- */
.m{font-family:var(--math-font);font-style:italic;font-size:1.05em;line-height:1.38;font-weight:normal;
  letter-spacing:.012em;word-break:break-word;white-space:normal}
.m .mn,.mn{font-family:var(--math-font);font-style:normal;letter-spacing:0}
.m .mi{font-style:italic}
.mop,.mo{font-family:var(--math-font);font-style:normal;padding:0 .06em;letter-spacing:0}
.msup,.msub{font-family:var(--math-font);font-size:.72em;line-height:1;letter-spacing:0;font-style:normal}
.msup{vertical-align:super}
.msub{vertical-align:sub}
/* 同时带上标与下标：右侧上下堆叠 */
.msubsup{display:inline-flex;flex-direction:column;align-items:flex-start;justify-content:center;
  vertical-align:middle;font-size:.72em;line-height:1.05;margin:0 .05em;font-family:var(--math-font)}
.msubsup>span{font-size:1em;vertical-align:baseline;line-height:1.05}
.mfrac{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;vertical-align:middle;
  margin:0 .22em;font-style:normal;font-size:.9em;line-height:1.2;font-family:var(--math-font)}
.mfrac .num,.mfrac .den{display:block;padding:0 .38em;white-space:nowrap}
.mfrac .num{border-bottom:1px solid currentColor;padding-bottom:.08em}
.mfrac .den{padding-top:.1em}
.msqrt{display:inline-flex;align-items:flex-start;white-space:nowrap;font-style:normal;font-family:var(--math-font)}
.msqrt .surd{transform:scaleY(1.2);display:inline-block;padding-right:.02em;font-style:normal}
.msqrt .rad{padding:.12em .16em 0 .1em;border-top:1px solid currentColor}
/* 大运算符 ∑ ∏ ∫ 及其上下限 */
.mbig{font-family:var(--math-font);font-style:normal;font-size:1.32em;line-height:.9;display:inline-block}
.mlim{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;
  vertical-align:middle;margin:0 .14em;font-size:.9em;line-height:1.15;font-family:var(--math-font)}
.mlim .limup,.mlim .limdown{font-size:.68em;font-style:normal;white-space:nowrap;line-height:1.15}
.mlim .limup{padding-bottom:.06em}
.mlim .limdown{padding-top:.06em}
/* 独立成行的公式块（$$…$$ / \[…\]） */
.mblock{display:block;margin:.34em 0;padding:.1em 0;text-align:center;font-size:1.06em;overflow-x:auto;overflow-y:hidden}
.mspace{display:inline-block;width:.25em}
.mbinom .mbcol{display:flex;flex-direction:column;align-items:center}
.mbinom .brk{font-size:1.5em;line-height:.9;font-style:normal;font-family:var(--math-font)}
.macc .acchead{font-size:.62em;line-height:1;font-style:normal;height:.9em;overflow:visible}
.macc .accbar,.macc .accund{width:100%;height:0;display:block;font-size:.7em}
/* 行内小分式（\binom） */
.mbinom{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;
  font-size:.85em;line-height:1.15;margin:0 .12em;font-family:var(--math-font);font-style:normal}
.mbinom>span{padding:0 .3em;white-space:nowrap}
/* 矩阵 / 行列式 */
.mmat{display:inline-flex;align-items:center;vertical-align:middle;margin:0 .18em;font-family:var(--math-font);font-style:normal}
.mmat .brk{font-size:1em;line-height:1;user-select:none}
.mmat .mgrid{display:grid;gap:.1em .55em;padding:0 .28em}
.mmat .mcell{text-align:center;font-style:italic;white-space:nowrap}
.mmat.det .brk{font-size:1.05em}
/* 上下划线 / 向量箭头 */
.macc{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;font-family:var(--math-font)}
.macc .accbar{border-top:1px solid currentColor;width:100%;height:0;font-size:.6em}
.macc .accund{border-bottom:1px solid currentColor;width:100%;height:0;font-size:.6em}
.mprev{display:block;margin-top:4px;padding:5px 8px;border-radius:8px;background:var(--fill-2);color:var(--fg-2);
  font-size:13px;white-space:pre-wrap;word-break:break-word}
/* ---------- AI 处理进度面板 ---------- */
.ai-prog-status{font-size:14px;font-weight:600;color:var(--fg);margin-bottom:8px;display:flex;align-items:center;gap:8px}
.ai-prog-status .spin{width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--blue);border-radius:50%;
  animation:aispin .8s linear infinite;flex:none}
@keyframes aispin{to{transform:rotate(360deg)}}
.ai-prog-list{max-height:250px;overflow-y:auto;border-top:1px solid var(--line-soft)}
.ai-prog-row{display:flex;gap:8px;padding:5px 2px;font-size:12.5px;color:var(--fg-2);border-bottom:1px dashed var(--line-soft);line-height:1.45}
.ai-prog-row .pt{flex:none;color:var(--muted);font-variant-numeric:tabular-nums}
.ai-prog-row.cur{color:var(--fg);font-weight:600}
.ai-prog-row.bad{color:var(--danger)}
.ai-prog-row.ok{color:var(--ok)}

/* ---------- 照片上传 / 缩略图 ---------- */
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.thumb{position:relative;width:76px;height:76px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--fill)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .del{position:absolute;top:0;right:0;width:26px;height:26px;border:0;background:rgba(60,57,53,.55);color:#fff;display:flex;align-items:center;justify-content:center;border-radius:0 0 0 10px}
.thumb-add{width:76px;height:76px;border-radius:10px;border:1px dashed #d3cec6;background:var(--fill-2);display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);font-size:11px;gap:2px}

/* ---------- 批改 ---------- */
.qitem{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px;background:var(--fill-2)}
.qitem.flag{border-color:#e0d0bb;background:#f8f2ea}
.qgrid{display:grid;grid-template-columns:78px 1fr;gap:8px;align-items:center}
.qgrid .k{font-size:12.5px;color:var(--muted)}
.ai-box{background:#f4f1ec;border-radius:10px;padding:8px 10px;margin-top:8px;font-size:12.5px}
.ai-edit{display:grid;grid-template-columns:70px 1fr;gap:6px;align-items:center;margin-top:8px}
.ai-edit input{min-height:38px}
.qresult{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:13px}
.chip.tap{cursor:pointer;border:1px solid var(--line)}
.chip.tap:active{background:var(--fill-2)}

/* ---------- 底部 Tab ---------- */
#tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(250,248,245,.96);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);
  -webkit-backdrop-filter:saturate(180%) blur(12px);backdrop-filter:saturate(180%) blur(12px);
}
#tabbar .tb-inner{max-width:1120px;margin:0 auto;display:flex}
.tab{
  flex:1;min-height:52px;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;padding:6px 0 5px;color:var(--muted);font-size:10.5px;cursor:pointer;
}
.tab .tab-ico{width:24px;height:24px;color:var(--muted)}
.tab.on{color:var(--blue)}
.tab.on .tab-ico{color:var(--blue)}
.tab .dot{position:absolute;margin:-2px 0 0 22px;width:7px;height:7px;border-radius:50%;background:var(--danger)}

/* ---------- Sheet / Toast ---------- */
#sheetRoot,#toastRoot{position:fixed;inset:0;z-index:60;pointer-events:none}
.mask{position:absolute;inset:0;background:rgba(52,50,46,.42);opacity:0;transition:opacity .22s;pointer-events:auto}
.mask.show{opacity:1}
.sheet{
  position:absolute;left:0;right:0;bottom:0;max-height:88vh;background:var(--card);border-radius:18px 18px 0 0;
  transform:translateY(102%);transition:transform .26s cubic-bezier(.32,.72,0,1);
  display:flex;flex-direction:column;pointer-events:auto;box-shadow:0 -6px 30px rgba(0,0,0,.14);
  padding-bottom:env(safe-area-inset-bottom);
}
.sheet.show{transform:translateY(0)}
.sheet-head{display:flex;align-items:center;gap:8px;padding:14px 14px 8px;border-bottom:1px solid var(--line-soft)}
.sheet-head .sh-title{font-size:16px;font-weight:600;flex:1;min-width:0}
.sheet-body{padding:12px 14px;overflow:auto;-webkit-overflow-scrolling:touch;flex:1}
.sheet-foot{padding:10px 14px 14px;display:flex;gap:10px;border-top:1px solid var(--line-soft)}
.sheet-foot .btn{flex:1}
.sheet-body .kv{display:flex;gap:8px;padding:6px 0;border-bottom:1px solid var(--line-soft);font-size:13.5px}
.sheet-body .kv .k{width:74px;flex:none;color:var(--muted)}
.sheet-body .kv .v{flex:1;word-break:break-word;white-space:pre-wrap}
.toast-wrap{position:absolute;left:0;right:0;bottom:calc(84px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{background:rgba(69,68,64,.95);color:#faf8f5;font-size:13.5px;padding:10px 16px;border-radius:12px;max-width:86%;text-align:center;opacity:0;transform:translateY(8px);transition:.22s}
.toast.show{opacity:1;transform:translateY(0)}

/* 没有 $…$ 定界符时：把含数学符号的连续片段单独套用数学字体，中文说明保持原字体 */

/* LaTeX 片段 → HTML（内部递归） */
function texToHTML(tex) {

      }

          name === 'bigl' || name === 'bigr' || name === 'Bigl' || name === 'Bigr') {
        while (i < n && /\s/.test(tex[i])) i++;

          var md = /^\\([a-zA-Z]+|.)/.exec(tex.slice(i));

        }

      }
      if (name === '\\') { out += MATH_DISPLAY ? '<br>' : ' '; continue; }   /* 换行 */
      var sym = MATH_SYMBOLS[name];
      if (sym === undefined) { emitText(name); continue; }   /* 未收录的命令：按普通文字输出 */
      if (sym === '') continue;
      if (MATH_OP_NAMES[name]) { out += wrap('mop', escapeHTML(sym)); continue; }
      out += escapeHTML(sym);
      continue;
    }
    if (c === '&') { out += ' '; i++; continue; }
    if (c === '\n') { out += ' '; i++; continue; }
    if (MATH_TEXMODE && /\s/.test(c)) { i++; continue; }   /* 显式公式内忽略源码空格 */
    emitText(c);
    i++;

}

/* 总开关：设置页可关闭公式排版，关掉后一律按纯文本显示 */
function mathEnabled() {
  try { return !(S && S.set && S.set.mathRender === false); } catch (e) { return true; }
}
/* 整段文本 → HTML：定界符内按公式渲染，其余按纯文本转义 */
function renderMathHTML(text) {
  text = String(text == null ? '' : text);
  if (!text) return '';
  if (!mathEnabled()) return escapeHTML(text);
  var re = /\$\$([\s\S]+?)\$\$|\$([^$\n]+?)\$|\\\[([\s\S]+?)\\\]|\\\(([\s\S]+?)\\\)/g;
  var out = '', last = 0, m;
  while ((m = re.exec(text))) {
    if (m.index > last) out += autoMathHTML(text.slice(last, m.index));
    var inner = m[1] || m[2] || m[3] || m[4] || '';
    var display = !!(m[1] || m[3]);
    MATH_DISPLAY = display;
    MATH_TEXMODE = true;
    var html = texToHTML(inner);
    MATH_TEXMODE = false;
    MATH_DISPLAY = false;
    out += display
      ? '<span class="m mblock">' + html + '</span>'
      : '<span class="m">' + html + '</span>';

function pad2(n) { return n < 10 ? '0' + n : '' + n; }

}

  } catch (e) {

}

  if (p.math != null) el.innerHTML = renderMathHTML(String(p.math));   /* 含公式则渲染为数学字体 */
  else if (p.text != null) el.textContent = String(p.text);
  if (p.style) el.setAttribute('style', p.style);
  if (p.attrs) { for (var k in p.attrs) el.setAttribute(k, p.attrs[k]); }
  if (p.on) { for (var k2 in p.on) el.addEventListener(k2, p.on[k2]); }
  if (p.d) { for (var k3 in p.d) el.setAttribute('data-' + k3, p.d[k3]); }
  var kids = children;
  if (kids != null && !Array.isArray(kids)) kids = [kids];
  (kids || []).forEach(function (c) {
    if (c == null || c === false) return;
    el.appendChild(typeof c === 'string' || typeof c === 'number' ? document.createTextNode(String(c)) : c);
  });
  return el;
}

/* ---------- 自定义底部 Sheet ---------- */
var sheetStack = [];
function openSheet(opts) {
  var root = document.getElementById('sheetRoot');
  var mask = h('div', { class: 'mask' });
  var sheet = h('div', { class: 'sheet' });
  var head = h('div', 'sheet-head');
  head.appendChild(h('div', { class: 'sh-title', text: opts.title || '' }));
  head.appendChild(h('button', {
    class: 'icon-btn dark', d: { act: 'sheet-close' }, attrs: { type: 'button', 'aria-label': '关闭' }
  }, [icon('close')]));
  var body = h('div', 'sheet-body');
  if (opts.body) body.appendChild(opts.body);
  sheet.appendChild(head);
  sheet.appendChild(body);
  var foot = h('div', 'sheet-foot');
  var api = {
    close: function () { closeSheet(handle); },
    body: body, foot: foot, sheet: sheet
  };
  (opts.buttons || []).forEach(function (b) {
    if (b === 'cancel') {
      foot.appendChild(h('button', { class: 'btn', d: { act: 'sheet-close' }, text: '取消', attrs: { type: 'button' } }));
      return;
    }
    var btn = h('button', { class: 'btn ' + (b.kind === 'primary' ? 'primary' : b.kind === 'danger' ? 'danger' : ''), text: b.text, attrs: { type: 'button' } });
    btn.addEventListener('click', function () { if (b.onClick) b.onClick(api); });
    foot.appendChild(btn);
  });
  if (foot.childNodes.length) sheet.appendChild(foot);
  mask.addEventListener('click', function () { if (opts.dismissible !== false) closeSheet(handle); });
  root.appendChild(mask);
  root.appendChild(sheet);
  requestAnimationFrame(function () { mask.classList.add('show'); sheet.classList.add('show'); });
  var handle = { mask: mask, sheet: sheet, opts: opts };
  sheetStack.push(handle);
  return api;
}
function closeSheet(handle) {
  if (!handle) return;
  handle.mask.classList.remove('show');
  handle.sheet.classList.remove('show');
  var idx = sheetStack.indexOf(handle);
  if (idx >= 0) sheetStack.splice(idx, 1);
  if (handle.opts && typeof handle.opts.onClose === 'function') {
    try { handle.opts.onClose(); } catch (e) { /* 关闭回调不影响收起动画 */ }
  }
  setTimeout(function () {
    if (handle.mask.parentNode) handle.mask.parentNode.removeChild(handle.mask);
    if (handle.sheet.parentNode) handle.sheet.parentNode.removeChild(handle.sheet);
  }, 260);
}
function closeTopSheet() {
  if (sheetStack.length) closeSheet(sheetStack[sheetStack.length - 1]);
}

function confirmSheet(title, msg, opts) {

      ],

/* ---------- 知识点选择 Sheet（三级树） ---------- */
function pickKnowledgeSheet(selected, opts) {
  opts = opts || {};
  return new Promise(function (resolve) {
    var sel = (selected || []).map(function (p) { return { module: p.module, chapter: p.chapter, point: p.point }; });
    var body = h('div');
    var multi = opts.multi !== false;
    var currentMod = 0, currentCh = -1;

    var pathBar = h('div', { class: 'row wrap', style: 'margin-bottom:8px' });
    var listBox = h('div');
    body.appendChild(pathBar);
    body.appendChild(listBox);

    function renderPath() {
      pathBar.textContent = '';
      var rootBtn = h('button', { class: 'linkbtn', d: {}, text: '全部模块' });
      rootBtn.addEventListener('click', function () { currentMod = 0; currentCh = -1; render(); });
      pathBar.appendChild(rootBtn);
      if (currentCh >= 0 || currentMod) {
        var mod = TREE[currentMod];
        pathBar.appendChild(h('span', { class: 'muted', text: '/' }));
        var mb = h('button', { class: 'linkbtn', text: mod.module });
        mb.addEventListener('click', function () { currentCh = -1; render(); });
        pathBar.appendChild(mb);
        if (currentCh >= 0) {
          pathBar.appendChild(h('span', { class: 'muted', text: '/' }));
          pathBar.appendChild(h('span', { class: 'small', text: mod.chapters[currentCh].name }));
        }
      }
    }
    function toggled(item) {
      return sel.some(function (s) { return s.point === item.point && s.module === item.module; });
    }
    function toggle(item) {
      var i = sel.findIndex(function (s) { return s.point === item.point && s.module === item.module; });
      if (i >= 0) sel.splice(i, 1);
      else {
        if (!multi) sel = [];
        sel.push({ module: item.module, chapter: item.chapter, point: item.point });
      }
      render();
    }
    function rowBtn(label, sub, onTap, selectedFlag) {
      var btn = h('button', {
        class: 'list-row tap', style: 'width:100%;text-align:left;border:0;background:transparent;color:inherit',
        attrs: { type: 'button' }
      }, [
        h('div', { class: 'lr-main' }, [
          h('div', { class: 'lr-title', text: label }),
          sub ? h('div', { class: 'lr-sub', text: sub }) : null
        ]),
        selectedFlag ? h('span', { style: 'color:var(--ok);display:flex' }, [icon('tick')]) : icon('caret')
      ]);
      btn.addEventListener('click', onTap);
      return btn;
    }
    function render() {
      renderPath();
      listBox.textContent = '';
      var mod = TREE[currentMod];
      if (currentCh < 0) {
        mod.chapters.forEach(function (ch, idx) {
          var cnt = ch.points.filter(function (p) {
            return sel.some(function (s) { return s.point === p; });
          }).length;
          listBox.appendChild(rowBtn(ch.name, ch.points.length + ' 个知识点' + (cnt ? ' · 已选 ' + cnt : ''),
            function () { currentCh = idx; render(); }, false));
        });
      } else {
        var ch = mod.chapters[currentCh];
        ch.points.forEach(function (pt) {
          var item = { module: mod.module, chapter: ch.name, point: pt };
          listBox.appendChild(rowBtn(pt, mod.module, function () { toggle(item); }, toggled(item)));
          });
      }
    }
    render();

    var selInfo = h('div', { class: 'small muted', style: 'margin-top:10px;white-space:pre-wrap', text: '' });
    body.appendChild(selInfo);
    function updSelInfo() {
      selInfo.textContent = sel.length ? '已选：' + sel.map(function (s) { return s.point; }).join('、') : '未选择知识点';
    }
    var origRender = render;
    render = function () { origRender(); updSelInfo(); };
    updSelInfo();

    openSheet({
      title: '选择知识点', body: body,
      buttons: [
        { text: '清空', onClick: function () { sel = []; render(); } },
        { text: '确定', kind: 'primary', onClick: function (api) { api.close(); resolve(sel); } }
      ]
    });
  });
}

/* ---------- 事件委托 ---------- */
var ACTIONS = {};
var CHANGE_ACTIONS = {};
var INPUT_ACTIONS = {};
document.addEventListener('click', function (e) {
  var el = e.target.closest ? e.target.closest('[data-act]') : null;
  if (!el) return;
  var act = el.getAttribute('data-act');
  var fn = ACTIONS[act];
  if (fn) { e.preventDefault(); fn(el, e); }
});
document.addEventListener('change', function (e) {
  var el = e.target.closest ? e.target.closest('[data-chact]') : null;
  if (!el) return;
  var fn = pickHandler(CHANGE_ACTIONS, chact, el.getAttribute('data-chact'));
  if (fn) fn(el, e);
});
document.addEventListener('input', function (e) {
  var el = e.target.closest ? e.target.closest('[data-inact]') : null;
  if (!el) return;
  var fn = pickHandler(INPUT_ACTIONS, inact, el.getAttribute('data-inact'));
  if (fn) fn(el, e);
});
function act(name, fn) { ACTIONS[name] = fn; }

/* 注册器：既支持 chact('x', fn) 调用，也支持 chact['x'] = fn 直接赋值
   （直接赋值会落到函数对象上，因此这里做一层转发 + 查找兜底） */
function makeRegistrar(store) {
  var base = function (name, fn) { store[name] = fn; return fn; };
  if (typeof Proxy === 'function') {
    return new Proxy(base, {
      set: function (t, k, v) { store[String(k)] = v; return true; },
      get: function (t, k) { return (k in store) ? store[k] : t[k]; }
    });
  }
  base.__store = store;
  return base;
}
function pickHandler(store, registrar, name) {
  if (!name) return null;
  if (store[name]) return store[name];
  if (registrar && typeof registrar[name] === 'function') return registrar[name];
  return null;
}
var chact = makeRegistrar(CHANGE_ACTIONS);
var inact = makeRegistrar(INPUT_ACTIONS);

ACTIONS['sheet-close'] = function () { closeTopSheet(); };

/* =========================================================
   1. 图片处理（压缩 / 上传来源 / 相机入口 / OCR 桥接）
   ========================================================= */
function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

function loadImage(src) {
  return new Promise(function (resolve, reject) {
    var img = new Image();
    img.onload = function () { resolve(img); };
    img.onerror = function () { reject(new Error('图片加载失败')); };
    img.src = src;
  });
}

function canvasFrom(img, maxSide, quality) {
  var w = img.naturalWidth || img.width, hgt = img.naturalHeight || img.height;
  var scale = Math.min(1, maxSide / Math.max(w, hgt));
  var tw = Math.max(1, Math.round(w * scale)), th = Math.max(1, Math.round(hgt * scale));
  var cv = document.createElement('canvas');
  cv.width = tw; cv.height = th;
  var ctx = cv.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, tw, th);
  ctx.drawImage(img, 0, 0, tw, th);
  return cv.toDataURL('image/jpeg', quality);
}

function fileToDataURL(file) {
  return new Promise(function (resolve, reject) {
    var fr = new FileReader();
    fr.onload = function () { resolve(String(fr.result)); };
    fr.onerror = function () { reject(new Error('文件读取失败')); };
    fr.readAsDataURL(file);
  });
}

function ensureDataURL(b64) {
  if (!b64) return '';
  return /^data:/i.test(b64) ? b64 : 'data:image/jpeg;base64,' + b64;
}

/* 上传限制：单张 ≤20MB，支持 JPG / PNG（iOS 相册的 HEIC/HEIF、WebP 也能解码） */
var MAX_IMAGE_BYTES = 20 * 1024 * 1024;
var OK_IMAGE_EXT = /\.(jpe?g|png|heic|heif|webp)$/i;

function fmtSize(n) {
  n = Number(n) || 0;
  if (n >= 1024 * 1024) return (n / 1024 / 1024).toFixed(1) + 'MB';
  if (n >= 1024) return Math.round(n / 1024) + 'KB';
  return n + 'B';
}

/* 校验单个文件：合规返回 null，不合规返回中文原因 */
function validateImageFile(f) {
  if (!f) return '没有读到文件';
  var size = (typeof f.size === 'number') ? f.size : 0;
  if (size > MAX_IMAGE_BYTES) return '超过 20MB（' + fmtSize(size) + '），请压缩后再传';
  var name = String(f.name || '');
  var type = String(f.type || '').toLowerCase();
  var extOK = OK_IMAGE_EXT.test(name);
  var mimeOK = /^image\//.test(type);
  /* 部分浏览器不给出 type，此时按扩展名判断；两者都没有就放行，交给解码阶段兜底 */
  if (!mimeOK && !extOK && type) return '不是图片格式（' + (type || name) + '），请传 JPG 或 PNG';
  return null;
}

/* 统一入口：压缩为最长边 <=1600 / JPEG 0.8，并生成缩略图
   入参可以是：base64 字符串 / dataURL / File / Blob / {file: File} */
async function processPhotoSource(src) {
  var dataURL;
  if (typeof src === 'string') dataURL = ensureDataURL(src);
  else if (src && src.file) dataURL = await fileToDataURL(src.file);
  else if (src && (typeof File !== 'undefined') && src instanceof File) dataURL = await fileToDataURL(src);
  else if (src && (typeof Blob !== 'undefined') && src instanceof Blob) dataURL = await fileToDataURL(src);
  else if (src && src.value) dataURL = ensureDataURL(src.value);           /* 旧版 {kind:'base64',value} */
  else throw new Error('没有可用的图片来源');
  var img = await loadImage(dataURL);
  var full = canvasFrom(img, 1600, 0.8);
  var thumb = canvasFrom(img, 360, 0.72);
  return { full: full, thumb: thumb, width: img.naturalWidth, height: img.naturalHeight };
}

/* 过滤一批文件：返回 { ok: [], problems: [{name, reason}] } */
function filterImageFiles(list) {
  var ok = [], problems = [];
  (list || []).forEach(function (f) {
    var reason = validateImageFile(f);
    if (reason) problems.push({ name: String(f.name || '未命名文件'), reason: reason });
    else ok.push(f);
  });
  return { ok: ok, problems: problems };
}

function extractBase64FromBridge(res) {
  if (!res) return '';
  if (typeof res === 'string') return res.replace(/^data:[^,]+,/, '');
  if (typeof res === 'object') {
    var cand = res.base64 || res.image || res.imageBase64 || res.data || res.result || res.value || res.url || res.path;
    if (typeof cand === 'string') return cand.replace(/^data:[^,]+,/, '');
    if (res.data && typeof res.data === 'object') {
      var c2 = res.data.base64 || res.data.image;
      if (typeof c2 === 'string') return c2.replace(/^data:[^,]+,/, '');
    }
  }
  return '';
}

/* 相册 / 相机选择器：inputId = fileAlbum（相册，可多选）或 filePhoto（相机） */
function pickImageFiles(inputId) {
  return new Promise(function (resolve) {
    var input = document.getElementById(inputId);
    if (!input) { resolve(null); return; }
    var done = false;
    function finish(val) {
      if (done) return;
      done = true;
      input.removeEventListener('change', handler);
      input.removeEventListener('cancel', cancelHandler);
      input.value = '';
      resolve(val);
    }
    var handler = function () {
      var fs = input.files ? Array.prototype.slice.call(input.files) : [];
      finish(fs.length ? fs : null);
    };
    /* 用户在系统选图器里点“取消”：不落定会残留监听器，下次选图会重复触发 */
    var cancelHandler = function () { finish(null); };
    input.addEventListener('change', handler);
    input.addEventListener('cancel', cancelHandler);
    input.click();
    /* 兜底：不支持 cancel 事件的环境里，超时后复位，避免 Promise 永久挂起 */
    setTimeout(function () { if (!done && (!input.files || !input.files.length)) finish(null); }, 120000);
  });
}

/* 宿主 App 原生相机桥接（可选入口，仅在 Bridge.takePhoto 存在时出现） */
function bridgeTakePhoto() {
  return new Promise(function (resolve, reject) {
    var br = (typeof window !== 'undefined') ? window.Bridge : null;
    if (!br || typeof br.takePhoto !== 'function') { reject(new Error('当前 App 没有提供相机桥接')); return; }
    var done = false;
    var timer = setTimeout(function () {
      if (done) return; done = true;
      reject(new Error('相机桥接超时，请改用“从相册选择”'));
    }, 8000);
    try {
      Promise.resolve(br.takePhoto()).then(function (res) {
        clearTimeout(timer);
        if (done) return; done = true;
        var b64 = extractBase64FromBridge(res);
        if (b64) resolve(b64);
        else reject(new Error('桥接返回为空，请改用“从相册选择”'));
      }).catch(function (e) {
        clearTimeout(timer);
        if (done) return; done = true;
        reject(e);
      });
    } catch (e) {
      clearTimeout(timer);
      if (done) return; done = true;
      reject(e);
    }
  });
}

/* iPad 风格照片来源面板：以“上传”为主，相机作为其中一个入口
   onPick 会在点击行的同一个手势任务里同步触发，保证 iOS 允许唤起文件选择器 / 相机 */
function photoSourceSheet(onPick) {

  function row(mode, ico, title, sub) {

      attrs: { type: 'button' }
    });
    r.appendChild(h('span', { style: 'display:flex;color:var(--fg-2)' }, [icon(ico)]));
    var m = h('div', { class: 'lr-main' });
    m.appendChild(h('div', { class: 'lr-title', text: title }));
    m.appendChild(h('div', { class: 'lr-sub', text: sub }));
    r.appendChild(m);

  }
  body.appendChild(h('div', { class: 'tiny muted', style: 'padding:2px 2px 8px', text: '支持 JPG / PNG，单张最大 20MB。上传后自动压缩为最长边 1600px 的 JPEG（质量 0.8）。' }));

/* OCR 桥接：视觉模型不可用时的第二选择 */
async function tryBridgeOCR(fullDataURL) {
  var br = (typeof window !== 'undefined') ? window.Bridge : null;
  if (!br || typeof br.ocr !== 'function') return null;
  try {
    var raw = fullDataURL.replace(/^data:[^,]+,/, '');
    var res = await Promise.race([Promise.resolve(br.ocr(raw)), sleep(25000).then(function () { return null; })]);
    if (!res) return null;
    if (typeof res === 'string') return res;
    if (typeof res === 'object') return res.text || res.result || res.content || JSON.stringify(res);
    return null;
  } catch (e) { return null; }
}

/* =========================================================
   2. AI 客户端（任意 OpenAI 兼容服务，唯一网络出口）
   ========================================================= */
function normalizeBaseUrl(u) {
  u = String(u || '').trim().replace(/\/+$/, '');
  if (!u) return '';
  /* 只剥掉用户多写的 /chat/completions；保留 /v1、/compatible-mode/v1、/api/paas/v4 等路径，
     这样 OpenAI / Kimi / OpenRouter / Ollama 等需要 /v1 的服务都能直连 */
  if (/\/chat\/completions$/i.test(u)) u = u.replace(/\/chat\/completions$/i, '');
  return u;
}

  function extractBalancedJSON(t) {

    options = options || {};

        { role: 'user', content: '你的上一条输出在结尾被截断了。请从中断的位置直接继续输出剩余内容：不要重复已输出的部分、不要加任何解释或代码块标记、不要重新开始，直接接着写完剩下的 JSON。' }
      ]);

      return X('设总体 X ~ N(μ, ' + (sigma * sigma) + ')，σ 已知。样本容量 n = ' + n + '，样本均值 x̄ = ' + xbar + '，求 μ 的置信水平为 95% 的置信区间（u₀.₀₂₅ = 1.96）。',
        '(' + fx(xbar - half) + ', ' + fx(xbar + half) + ')',
        '置信区间为 x̄ ± u_{α/2}·σ/√n。');
    },
    function () {
      var n = ri(9, 25);
      return X('总体方差 σ² 未知时，正态总体均值 μ 的区间估计应使用什么统计量？并说明自由度。',
        '使用 t 统计量 T = (X̄ − μ)/(S/√n) ~ t(n − 1)，自由度为 n − 1 = ' + (n - 1) + '（n = ' + n + '）；置信区间为 X̄ ± t_{α/2}(n−1)·S/√n。',
        'σ 未知时用样本标准差 S 代替，枢轴量服从 t 分布而非正态分布。');
    }
  ]
};

function localExercisesForPoint(point, count) {
  var arr = TPL[point];
  if (!arr || !arr.length) return [];
  var n = Math.min(count || 2, arr.length);
  var idxs = pickDistinct(arr.map(function (_, i) { return i; }), Math.max(1, n));
  return idxs.map(function (i) {
    try {
      var ex = arr[i]();
      ex.source = 'local';
      ex.points = [point];
      return ex;
    } catch (e) { return null; }
  }).filter(Boolean);
}

function fallbackExercises(kpNames) {
  var a = ri(2, 9), b = ri(2, 9);
  return [X('计算：(' + a + ' + ' + b + ') × ' + ri(2, 5) + ' = ?', String((a + b) * ri(2, 5)), '基础四则运算，注意运算顺序。')];
}

/* 本地生成：为每道题的知识点至少产出 2 道不同类型，保证 ≥2 题 */
function generateLocalExercises(points) {
  var out = [];
  (points || []).forEach(function (p) {
    var name = (typeof p === 'string') ? p : (p.point || '');
    var got = localExercisesForPoint(name, 2);
    out = out.concat(got);
  });
  if (!out.length) out = out.concat(fallbackExercises());
  if (out.length < 2) {
    var extra = localExercisesForPoint(pk(Object.keys(TPL)), 2);
    out = out.concat(extra);
  }
  return out.slice(0, 4);
}

/* ---------- AI 处理进度面板：识别 / 生成期间实时展示每一步 ---------- */
var AIProgress = (function () {
  var api = null, statusEl = null, listEl = null, finished = false, autoTimer = null;
  var rows = [];
  function ensure() {
    if (api && api.sheet && api.sheet.parentNode) return true;
    api = null; statusEl = null; listEl = null; rows = []; finished = false;
    if (autoTimer) { clearTimeout(autoTimer); autoTimer = null; }
    var body = h('div');
    statusEl = h('div', 'ai-prog-status', [h('span', 'spin'), h('span', { text: '准备中…' })]);
    listEl = h('div', 'ai-prog-list');
    body.appendChild(statusEl);
    body.appendChild(listEl);
    api = openSheet({
      title: 'AI 处理进度', body: body, dismissible: false,
      buttons: [{ text: '后台运行', onClick: function (a) { a.close(); } }]
    });
    return true;
  }
  function pushRow(text, cls) {
    var d = new Date();
    var t = pad2(d.getHours()) + ':' + pad2(d.getMinutes()) + ':' + pad2(d.getSeconds());
    rows.push({ t: t, text: text, cls: cls || '' });
    if (rows.length > 60) rows.shift();
    if (!listEl) return;
    listEl.textContent = '';
    rows.forEach(function (r, i) {
      listEl.appendChild(h('div', {
        class: 'ai-prog-row' + (r.cls ? ' ' + r.cls : '') + (i === rows.length - 1 && !finished ? ' cur' : '')
      }, [
        h('span', { class: 'pt', text: r.t }),
        h('span', { text: r.text })
      ]));
    });
    listEl.scrollTop = listEl.scrollHeight;
  }
  return {
    step: function (msg) { ensure(); if (statusEl) statusEl.textContent = msg; pushRow(msg); },
    bad: function (msg) { ensure(); pushRow(msg, 'bad'); },
    ok: function (msg) { ensure(); pushRow(msg, 'ok'); },
    done: function (ok, summary) {
      if (!api) { toast(summary || (ok ? 'AI 处理完成' : 'AI 处理失败'), ok ? 'ok' : 'err'); return; }
      finished = true;
      if (statusEl) {
        statusEl.textContent = summary || (ok ? '处理完成' : '处理失败');
        var sp = statusEl.querySelector('.spin');
        if (sp) sp.parentNode.removeChild(sp);
      }
      pushRow(summary || (ok ? '处理完成' : '处理失败'), ok ? 'ok' : 'bad');
      autoTimer = setTimeout(function () { if (api) api.close(); api = null; }, 1800);
    },
    close: function () { if (api) { api.close(); api = null; } }
  };
})();

function gradeOneSystemPrompt() {

    '输出格式：{"question_text":"题干要点","standard_answer":"标准答案","solution":"解答步骤","is_correct":true/false/null,"confidence":0~1,"knowledge_points":["知识点"],"error_reason":"错因","suggestion":"复习建议"}\n' +
    '约束：\n1. knowledge_points 必须严格取自下列知识点名，不得自创、不得改写：\n' + kpNameList() + '\n' +
    '2. 只输出一个 JSON 对象，不要数组、不要任何其他文字；\n' +
    '3. 先给出正确标准答案与解答，再判定用户作答对错；不要用识别到的作答充当标准答案；\n' +
    '4. solution 只写关键步骤（不超过 8 行），简洁为主；\n' +

    '6. 选择题、填空题严格判分；解答题、证明题只给“对 / 错 / 部分对”，不确定就降低 confidence 并说明理由；\n' +
    '7. question_text、standard_answer、solution 中的数学一律用 LaTeX（如 $x^2$、$\\frac{1}{2}$、$\\int_0^1 x\\,dx$），矩阵用 \\begin{pmatrix}...\\end{pmatrix}。';
}
function classifySystemPrompt() {

    '输出格式：{"knowledge_points":[{"module":"模块","chapter":"章节","point":"知识点"}],"error_type":"错误类型","confidence":0~1,"reason":"归类理由"}\n' +
    '约束：\n1. module 只能是：' + MODULE_ORDER.join(' / ') + '；\n2. chapter 与 point 必须来自该 module 下的取值，不得自创；\n' +

function exerciseSystemPrompt() {

    '输出格式：{"exercises":[{"question":"题目","answer":"答案","hint":"解题思路","knowledge_points":["知识点"]}]}\n' +
    '约束：\n1. 题目必须能用初等数学表述，答案与解析必须正确且可验证；\n2. knowledge_points 必须取自以下名称：\n' + kpNameList() + '\n3. 不要与原题完全相同，要换参数或换角度（至少 2 道不同类型）；\n' +
    '4. question / answer / hint 里的数学内容一律写成 LaTeX（如 $\\int_0^1 x^2 dx$、$\\frac{1}{2}$、$A^{-1}$），不要直接用 Unicode 符号。';

function kpNameList() {

function normalizePoints(raw) {
  var out = [];
  (raw || []).forEach(function (p) {
    if (typeof p === 'string') {
      var hit = findPointByName(p);
      if (hit) out.push({ module: hit.module, chapter: hit.chapter, point: hit.point });
    } else if (p && p.point) {
      var hit2 = findPointByName(p.point);
      if (hit2) out.push({ module: hit2.module, chapter: hit2.chapter, point: hit2.point });
      else if (p.module && p.chapter) out.push({ module: p.module, chapter: p.chapter, point: p.point });
    }
  });
  var seen = {}, res = [];
  out.forEach(function (o) { var k = o.module + '|' + o.point; if (!seen[k]) { seen[k] = 1; res.push(o); } });
  return res;
}

async function aiClassifyQuestion(q) {

/* 单题判分：只发这一道题的照片 + 题号，输出题干/标准答案/解答/判分/知识点。
   一次一题：输出短、不截断、可单独重试，AI 反馈也更准更快 */
async function aiGradeOneQuestion(q, d) {
  if (!DeepSeekClient.hasConfig()) throw { type: 'nokey', message: '未配置 API Key 或代理' };
  var hasImg = (q.images || []).length > 0;
  var vision = DeepSeekClient.hasVision() && hasImg;
  var text = '试卷名称：' + (d.name || '未命名') +
    '\n题号：' + (q.no || '?') +
    '\n题型：' + (q.type || '解答题') +
    (q.userAnswer ? '\n用户作答（手写/录入）：' + q.userAnswer : '\n用户作答：（未填写，请从照片识别）') +
    (q.std ? '\n用户另提供的标准答案（仅供参考，请仍独立判断）：' + q.std : '') +
    '\n请识别这一道题、给出标准答案与解答，并判定用户作答对错、归类知识点。';
  var messages = [{ role: 'system', content: gradeOneSystemPrompt() }];
  var res;
  if (vision) {
    var content = [{ type: 'text', text: text }];
    (q.images || []).forEach(function (img) {
      content.push({ type: 'image_url', image_url: { url: img.full } });
    });
    messages.push({ role: 'user', content: content });
    res = await DeepSeekClient.visionChat(messages, { max_tokens: 4096 });
  } else {
    if (hasImg) {
      /* 视觉模型不可用：先试 OCR 桥接，把识别文本喂给文本模型 */
      var ocr = await tryBridgeOCR(q.images[0].full);
      if (ocr) text += '\n（图片 OCR 文本）：' + ocr;
    }
    messages.push({ role: 'user', content: text + (hasImg ? '\n（当前模型不支持读图，图片无法发送，请仅依据文本判分；无法判断则 is_correct 返回 null。）' : '') });
    res = await DeepSeekClient.chat(messages, { max_tokens: 4096 });
  }
  return normalizeOneResult(res, q, d);
}

/* 把 AI 结果标准化，并把题号/试卷名对齐到「输入的题号 + 试卷名」，避免 AI 返回错位 */
function normalizeOneResult(res, q, d) {
  var conf = (typeof res.confidence === 'number') ? Math.max(0, Math.min(1, res.confidence)) : 0.5;
  var isCorrect = (res.is_correct === false || res.is_correct === 'false') ? false
    : ((res.is_correct === true || res.is_correct === 'true') ? true : null);
  return {
    qid: q.id,
    no: String(q.no),                 /* 题号以用户输入为准 */
    examName: d.name || '未命名',
    type: q.type || '解答题',
    questionText: String(res.question_text || res.questionText || ''),
    correctAnswer: String(res.standard_answer != null ? res.standard_answer : (res.correctAnswer || res.answer || '')),
    solution: String(res.solution || res.explanation || ''),
    isCorrect: isCorrect,
    confidence: conf,
    knowledgePoints: normalizePoints(res.knowledge_points || []),
    errorReason: String(res.error_reason || res.errorReason || ''),
    suggestion: String(res.suggestion || ''),
    needConfirm: conf < 0.7 || isCorrect === null,
    selected: false,
    saved: false,
    source: 'ai-one'
  };
}

      'AI 会把解答与「试卷名称 + 题号」对应起来，自动补全题干、标准答案、解答、知识点与错因。' +
      (DeepSeekClient.hasVision() ? '当前已配置视觉模型，题目照片会直接发给模型。' : '当前未填写视觉模型，无法读图，将只用文本判分，准确度会下降。'))
  }));

}

/* 已录入过的套卷名（来自批改历史 + 错题本 + 标准答案库），用于同名自动归类 */
function knownPaperNames() {
  var seen = {}, out = [];
  S.exam.forEach(function (r) { if (r.name && !seen[r.name]) { seen[r.name] = 1; out.push({ n: r.name, t: r.date || 0 }); } });
  S.wq.forEach(function (q) { if (q.examName && !seen[q.examName]) { seen[q.examName] = 1; out.push({ n: q.examName, t: q.createdAt || 0 }); } });
  Object.keys(S.ans || {}).forEach(function (n) { if (n && !seen[n]) { seen[n] = 1; out.push({ n: n, t: 0 }); } });
  return out.sort(function (a, b) { return b.t - a.t; }).map(function (x) { return x.n; }).slice(0, 12);
}

/* 同名套卷 + 同题号是否已有记录（用于冲突提醒） */
function samePaperNoConflicts(name, no) {
  var hits = [];
  S.wq.forEach(function (w) {
    if (w.examName === name && String(w.questionNo) === String(no)) hits.push('错题本（' + fmtDate(w.createdAt) + '）');
  });
  S.exam.forEach(function (r) {
    (r.items || []).forEach(function (it) {
      if (r.name === name && String(it.no) === String(no)) hits.push('批改历史（' + fmtDate(r.date) + '）');
    });
  });
  return hits;
}

/* 单题判分结果：内联在题目卡片下方 */

  top.appendChild(h('span', { class: 'chip ' + (r.isCorrect === false ? 'warn' : r.isCorrect === true ? 'ok' : 'gray'), text: r.isCorrect === false ? '判错' : r.isCorrect === true ? '判对' : '待确认' }));

  if (r.needConfirm) top.appendChild(h('span', { class: 'chip warn' }, [icon('warn'), h('span', { text: '需人工确认' })]));
  if (r.saved) top.appendChild(h('span', { class: 'chip ok' }, [icon('check2'), h('span', { text: '已入库' })]));
  wrap.appendChild(top);

  if (r.questionText) {

  });

  var foot = h('div', { class: 'row wrap', style: 'margin-top:8px' });

function renderExamHistory() {
  var card = h('div', 'card');
  card.appendChild(h('div', 'sec-title', [h('span', { class: 'st-line' }), h('span', { text: '批改历史（按试卷归类）' })]));
  if (!S.exam.length) {
    card.appendChild(h('div', { class: 'small muted', text: '还没有批改记录。完成一次判分并保存后会按试卷名称归到这里。' }));
    return card;
  }
  /* 按试卷名称分组，组内按时间倒序 */
  var groups = {};
  S.exam.forEach(function (rec) {
    var nm = rec.name || '未命名套卷';
    if (!groups[nm]) groups[nm] = [];
    groups[nm].push(rec);
  });
  Object.keys(groups).sort(function (a, b) {
    var ta = Math.max.apply(null, groups[a].map(function (r) { return r.date || 0; }));
    var tb = Math.max.apply(null, groups[b].map(function (r) { return r.date || 0; }));
    return tb - ta;
  }).forEach(function (nm) {
    var recs = groups[nm].sort(function (a, b) { return (b.date || 0) - (a.date || 0); });
    var ghead = h('div', { class: 'ghead', style: 'margin-top:2px' }, [
      h('span', { class: 'gname', text: nm }),
      h('span', { class: 'gnum', text: recs.length + ' 次记录' })
    ]);
    card.appendChild(ghead);
    recs.forEach(function (rec) {
      var meta = [];
      if (rec.examDate) meta.push('做题 ' + rec.examDate);
      meta.push(rec.total + ' 题');
      meta.push('正确 ' + (rec.correct == null ? '—' : rec.correct));
      meta.push('新增错题 ' + rec.newWrong);
      var row = h('div', { class: 'list-row tap', d: { act: 'hist-toggle', id: rec.id } });
      row.appendChild(h('div', 'lr-main', [
        h('div', { class: 'lr-sub', text: '批改于 ' + fmtDate(rec.date) + ' · ' + meta.join(' · ') })
      ]));
      row.appendChild(h('span', { class: 'chip gray', text: UI.expandedExam[rec.id] ? '收起' : '详情' }));
      card.appendChild(row);
      if (UI.expandedExam[rec.id]) {
        var box = h('div', { style: 'padding:4px 12px 10px;background:var(--fill-2);border-top:1px solid var(--line-soft)' });
        var detail = h('div', { class: 'small muted', text: '本次共 ' + rec.total + ' 题，判对 ' + (rec.correct == null ? '—' : rec.correct) + '，新增错题 ' + rec.newWrong + ' 题。' });
        box.appendChild(detail);
        card.appendChild(box);
      }
    });
  });
  return card;
}

/* 同名套卷 + 同题号冲突提醒（不阻塞，仅提醒做区分） */
function remindNoConflict(d, q) {
  if (!d.name || !q) return;
  var conflicts = samePaperNoConflicts(d.name, q.no);
  if (conflicts.length) {
    confirmSheet('同名同题号已存在',
      '《' + d.name + '》第 ' + q.no + ' 题已在「' + conflicts.join('、') + '」有记录。\n若这是同一道题的重复录入，可直接判分；若是另一道题，请点标题改题号以区分。',
      { confirmText: '知道了' });
  }
}

ACTIONS['exam-ask-no'] = function (el) {
  var d = ensureDraft(), idx = parseInt(el.getAttribute('data-idx'), 10), q = d.qs[idx];
  if (!q) return;
  promptSheet('修改题号', '第 ' + q.no + ' 题的新题号', q.no, { inputmode: 'decimal' }).then(function (v) {
    if (v == null) return;
    v = String(v).trim();
    if (!v || v === q.no) return;
    setQuestionNo(d, q, v, renderExam);
  });
};

/* 修改题号：草稿内查重 + 同名套卷查重并提醒 */
function setQuestionNo(d, q, v, onDone) {
  var dup = d.qs.find(function (x) { return x !== q && String(x.no) === String(v); });
  if (dup) { toast('题号 ' + v + ' 已在草稿内使用，请换一个', 'warn'); if (onDone) onDone(); return; }
  var conflicts = d.name ? samePaperNoConflicts(d.name, v) : [];
  if (!conflicts.length) { q.no = v; if (onDone) onDone(); return; }
  confirmSheet('同名同题号已存在',
    '《' + (d.name || '该套卷') + '》第 ' + v + ' 题已在「' + conflicts.join('、') + '」有记录，继续会新增一条重复。建议改用其它题号以区分。',
    { confirmText: '仍用 ' + v, cancelText: '不改了' })
    .then(function (ok) { if (ok) q.no = v; if (onDone) onDone(); });
}

/* 单题照片：把所选照片全部加到「这一道题」下 */
function addPhotosToDraft(d, idxAttr, mode) {
  var step = (mode === 'bridge')
    ? bridgeTakePhoto().then(function (b64) { return [b64]; })
    : pickImageFiles(mode === 'camera' ? 'filePhoto' : 'fileAlbum');
  return step.then(function (list) {
    if (!list || !list.length) return;
    var idx = idxAttr != null ? parseInt(idxAttr, 10) : -1;
    var q = d.qs[idx];
    if (!q) { toast('请先添加题目', 'err'); return; }
    var picked = filterImageFiles(list);
    if (picked.problems.length) {
      toast('已跳过 ' + picked.problems.length + ' 个文件：' +
        picked.problems.slice(0, 2).map(function (p) { return p.reason; }).join('；'), 'err', 4200);
    }
    if (!picked.ok.length) return;
    return Promise.all(picked.ok.map(function (src) { return processPhotoSource(src); }))
      .then(function (resList) {
        resList.forEach(function (res) {
          q.images = q.images || [];
          q.images.push({ thumb: res.thumb, full: res.full });
        });
        renderExam();
        toast('已添加 ' + resList.length + ' 张照片到第 ' + q.no + ' 题（已压缩）', 'ok');
      });
  }).catch(function (e) {
    if (e && (e.message === '已取消拍照' || e.message === '已取消添加照片')) return;
    toast((e && e.message) ? e.message : '添加照片失败', 'err');
  });
}

async function gradeOneWithUI(d, q) {
  if (!DeepSeekClient.hasConfig()) { toast('未配置 API Key / 代理，请先到设置填写', 'err'); return; }
  if (!d.name.trim()) { toast('请先填写试卷名称', 'err'); return; }
  DeepSeekClient.onStatus(function (m) { AIProgress.step(m); });
  DeepSeekClient.setStatusContext('第 ' + q.no + ' 题');
  AIProgress.step('正在判分《' + d.name + '》第 ' + q.no + ' 题…');
  try {
    var r = await aiGradeOneQuestion(q, d);
    q.result = r;
    if (d.autoImport && r.isCorrect === false && !r.saved) importWrongAuto(d, [r]);
    AIProgress.done(true, '第 ' + q.no + ' 题判分完成：' + (r.isCorrect === false ? '判错' : r.isCorrect === true ? '判对' : '待确认'));

}

async function gradeManyWithUI(d, list) {
  var done = 0, failed = 0;
  for (var i = 0; i < list.length; i++) {
    var q = list[i];
    DeepSeekClient.setStatusContext('第 ' + q.no + ' 题');
    AIProgress.step('正在判分《' + d.name + '》第 ' + q.no + ' 题（' + (i + 1) + '/' + list.length + '）…');
    try {
      var r = await aiGradeOneQuestion(q, d);
      q.result = r;
      if (d.autoImport && r.isCorrect === false && !r.saved) importWrongAuto(d, [r]);
      AIProgress.ok('第 ' + q.no + ' 题：' + (r.isCorrect === false ? '判错' : r.isCorrect === true ? '判对' : '待确认'));
      done++;
    } catch (e) {
      AIProgress.bad('第 ' + q.no + ' 题判分失败：' + friendlySafe(e));
      failed++;
    }
  }
  DeepSeekClient.setStatusContext('');
  AIProgress.done(true, '批量判分完成：成功 ' + done + ' 题' + (failed ? '，失败 ' + failed + ' 题' : ''));
  renderExam();
  if (done) saveExamRecord(d, true);

/* 自动入库：只写 isCorrect===false 且未入库的题 */
function importWrongAuto(d, results) {
  var n = 0;
  (results || []).forEach(function (r) {
    if (r.saved) return;
    if (r.isCorrect !== false) return;
    var wq = resultToWrong(r, d);
    S.wq.push(wq);
    r.saved = true;
    r.wqId = wq.id;
    n++;
  });
  if (n) {
    saveWQ();
    results.forEach(function (r) { if (r.knowledgePoints) touchKnowledge(r.knowledgePoints); });
  }
  return n;
}

/* 截断题目文本时不要把 $…$ 公式切一半，否则会露出 LaTeX 源码 */
function clipMathText(t, max) {
  t = String(t || '');
  if (t.length <= max) return t;
  var cut = t.slice(0, max);
  var end = max;
  if ((cut.split('$').length - 1) % 2 === 1) end = Math.min(end, cut.lastIndexOf('$'));
  var bo = cut.lastIndexOf('\\('), bb = cut.lastIndexOf('\\[');
  var boe = cut.indexOf('\\)', bo), bbe = cut.indexOf('\\]', bb);
  if (bo >= 0 && boe < 0) end = Math.min(end, bo);
  if (bb >= 0 && bbe < 0) end = Math.min(end, bb);
  var bs = cut.lastIndexOf('\\');
  if (bs >= 0 && end - bs < 12) end = Math.min(end, bs);
  if (end < 1) end = max;
  return cut.slice(0, end).replace(/[\s，。、；：,.;]+$/, '') + '…';
}
function wqTitle(q) {
  var t = (q.questionText || '').trim();
  if (t) return clipMathText(t, 46);
  if (q.examName) return q.examName + ' 第 ' + (q.questionNo || '?') + ' 题';
  return '未命名错题';
}
function wqSearchBlob(q) {
  return [
    q.questionText, q.userAnswer, q.correctAnswer, q.errorReason, q.suggestion,
    q.examName, q.questionNo, q.errorType,
    (q.knowledgePoints || []).map(function (p) { return p.point + p.chapter + p.module; }).join(' ')
  ].map(function (x) { return x || ''; }).join(' ').toLowerCase();
}
function wqFiltered() {
  var s = UI.wrong.q.trim().toLowerCase();
  return S.wq.filter(function (q) {
    if (UI.wrong.onlyUnfinished && q.checked) return false;
    if (UI.wrong.errorType && (q.errorType || '') !== UI.wrong.errorType) return false;
    if (s && wqSearchBlob(q).indexOf(s) < 0) return false;
    return true;
  });
}
function buildGroupTree(list) {
  var mods = [];
  function findMod(name) {
    var m = mods.find(function (x) { return x.name === name; });
    if (!m) { m = { name: name, chapters: [], count: 0 }; mods.push(m); }
    return m;
  }
  function findCh(mod, name) {
    var c = mod.chapters.find(function (x) { return x.name === name; });
    if (!c) { c = { name: name, points: [], count: 0 }; mod.chapters.push(c); }
    return c;
  }
  function findPt(ch, name) {
    var p = ch.points.find(function (x) { return x.name === name; });
    if (!p) { p = { name: name, items: [] }; ch.points.push(p); }
    return p;
  }
  list.forEach(function (q) {
    var pts = (q.knowledgePoints && q.knowledgePoints.length)
      ? q.knowledgePoints
      : [{ module: '未分类', chapter: '待归类', point: '待归类' }];
    var seen = {};
    pts.forEach(function (p) {
      var key = p.module + '|' + p.chapter + '|' + p.point;
      if (seen[key]) return;
      seen[key] = 1;
      var mod = findMod(p.module);
      var ch = findCh(mod, p.chapter);
      var pt = findPt(ch, p.point);
      pt.items.push(q);
      mod.count++; ch.count++;
    });
  });
  var order = MODULE_ORDER.concat(['未分类']);
  mods.sort(function (a, b) { return order.indexOf(a.name) - order.indexOf(b.name); });
  return mods;
}

function wqCard(q) {
  var wrap = h('div', { class: 'wq' + (q.checked ? ' done' : '') });
  var top = h('div', 'wq-top');
  var cbSpan = h('span', { class: 'cb' + (q.checked ? ' on' : '') });
  var tickWrap = document.createElement('span');
  tickWrap.className = 'tick';
  tickWrap.innerHTML = ICONS.tick;
  cbSpan.appendChild(tickWrap);
  var hit = h('button', { class: 'cb-hit', d: { act: 'wq-check', id: q.id }, attrs: { type: 'button', 'aria-label': '标记已掌握' } }, [cbSpan]);
  top.appendChild(hit);

  if (q.imageThumb) {
    var im = document.createElement('img');
    im.className = 'wq-img'; im.src = q.imageThumb; im.alt = '错题图片';
    top.appendChild(im);
  }

  var main = h('div', 'wq-main');
  main.appendChild(h('div', { class: 'wq-title', math: wqTitle(q) }));
  if (q.questionText && q.questionText.length > 46) {
    main.appendChild(h('div', { class: 'wq-text', math: q.questionText }));
  }
  var meta = h('div', 'wq-meta');
  if (q.examName) meta.appendChild(h('span', { class: 'chip gray', text: q.examName.slice(0, 14) + (q.questionNo ? ' #' + q.questionNo : '') }));
  (q.knowledgePoints || []).slice(0, 3).forEach(function (p) {
    meta.appendChild(h('span', { class: 'chip ' + modCls(p.module), text: p.point }));
  });
  if (q.errorType) meta.appendChild(h('span', { class: 'chip warn', text: q.errorType }));
  if (q.checked) {
    meta.appendChild(h('span', { class: 'chip ok', text: '已掌握 · ' + (q.reviewIntervalIndex >= REVIEW_INTERVALS.length ? '15' : REVIEW_INTERVALS[Math.min(q.reviewIntervalIndex, 3)]) + ' 天后复习' }));
  } else if (q.nextReviewAt) {
    var d = daysUntil(q.nextReviewAt);
    meta.appendChild(h('span', { class: 'chip ' + (d <= 0 ? 'warn' : 'gray'), text: d <= 0 ? '今日待复习' : d + ' 天后复习' }));
  }
  main.appendChild(meta);

  var acts = h('div', 'wq-acts');
  acts.appendChild(h('button', { class: 'btn sm', d: { act: 'wq-open', id: q.id }, attrs: { type: 'button' } }, [icon('list'), h('span', { text: '详情' })]));
  acts.appendChild(h('button', { class: 'btn sm', d: { act: 'wq-ex', id: q.id }, attrs: { type: 'button' } }, [icon('spark'), h('span', { text: '举一反三' })]));
  acts.appendChild(h('button', { class: 'btn sm', d: { act: 'wq-edit', id: q.id }, attrs: { type: 'button' } }, [icon('edit'), h('span', { text: '编辑' })]));
  acts.appendChild(h('button', { class: 'btn sm danger', d: { act: 'wq-del', id: q.id }, attrs: { type: 'button' } }, [icon('trash'), h('span', { text: '删除' })]));
  main.appendChild(acts);
  top.appendChild(main);
  wrap.appendChild(top);
  return wrap;
}

/* ---------- 勾选与间隔复习 ---------- */
function findWQ(id) { return S.wq.find(function (q) { return q.id === id; }); }

ACTIONS['wq-check'] = function (el) {
  var q = findWQ(el.getAttribute('data-id'));
  if (!q) return;
  if (!q.checked) {
    var stage = Math.min(q.reviewIntervalIndex || 0, REVIEW_INTERVALS.length - 1);
    q.checked = true;
    q.checkedAt = Date.now();
    q.nextReviewAt = Date.now() + REVIEW_INTERVALS[stage] * DAY;
    q.reviewIntervalIndex = Math.min(stage + 1, REVIEW_INTERVALS.length - 1);
    touchKnowledge(q.knowledgePoints);
    saveWQ();
    toast('已标记掌握，' + REVIEW_INTERVALS[stage] + ' 天后再来复习', 'ok');
    openAfterCheckSheet(q, stage);
  } else {
    q.checked = false;
    q.reviewIntervalIndex = 0;
    q.nextReviewAt = Date.now() + DAY;
    saveWQ();
    toast('已重置，明天重新复习', 'err');
  }
  renderPage(UI.tab);
};

function buildEditBody(q) {
  var isNew = !q;
  q = q || { id: uid(), questionText: '', userAnswer: '', correctAnswer: '', errorReason: '', errorType: '', knowledgePoints: [], questionNo: '', examName: '', questionType: '' };
  var body = h('div');
  var qt = h('textarea', { class: 'textarea', style: 'min-height:88px', attrs: { placeholder: '题目内容（可直接粘贴文本）。数学可写 LaTeX，如 $\\int_0^1 x^2dx$' } });
  qt.value = q.questionText || '';
  body.appendChild(h('div', 'field', [h('label', { text: '题目' }), qt]));
  var qtPrev = h('div', { class: 'mprev', style: 'display:none' });
  function syncQtPrev() {
    var v = qt.value || '';
    if (hasMathMarks(v)) { qtPrev.style.display = ''; qtPrev.innerHTML = renderMathHTML(v); }
    else qtPrev.style.display = 'none';
  }
  qt.addEventListener('input', syncQtPrev);
  syncQtPrev();
  body.appendChild(qtPrev);

  var rowSrc = h('div', { class: 'row wrap' });
  var examIn = h('input', { class: 'input', attrs: { type: 'text', placeholder: '如 2023 年数学三真题' } }); examIn.value = q.examName || '';
  var noIn = h('input', { class: 'input', style: 'max-width:110px', attrs: { type: 'text', placeholder: '题号' } }); noIn.value = q.questionNo || '';
  rowSrc.appendChild(examIn); rowSrc.appendChild(noIn);
  body.appendChild(h('div', 'field', [h('label', { text: '来源套卷 / 题号（可选）' }), rowSrc]));

  var r1 = h('div', { class: 'row wrap' });
  var ua = h('input', { class: 'input', attrs: { type: 'text', placeholder: '我的答案' } }); ua.value = q.userAnswer || '';
  var ca = h('input', { class: 'input', attrs: { type: 'text', placeholder: '标准答案' } }); ca.value = q.correctAnswer || '';
  r1.appendChild(ua); r1.appendChild(ca);
  body.appendChild(h('div', 'field', [h('label', { text: '答案' }), r1]));
  var ansPrev = h('div', { class: 'mprev', style: 'display:none' });
  function syncAnsPrev() {
    var v = ((ua.value || '') + '   ' + (ca.value || '')).trim();
    if (hasMathMarks(v)) { ansPrev.style.display = ''; ansPrev.innerHTML = renderMathHTML(v); }
    else ansPrev.style.display = 'none';
  }
  ua.addEventListener('input', syncAnsPrev);
  ca.addEventListener('input', syncAnsPrev);
  syncAnsPrev();
  body.appendChild(ansPrev);

  var reason = h('textarea', { class: 'textarea', style: 'min-height:70px', attrs: { placeholder: '错在哪一步？为什么错？' } });
  reason.value = q.errorReason || '';
  body.appendChild(h('div', 'field', [h('label', { text: '错误原因' }), reason]));

  var typeSel = h('select', 'select');
  var o0 = document.createElement('option'); o0.value = ''; o0.textContent = '未选择'; typeSel.appendChild(o0);
  ERROR_TYPES.forEach(function (t) {
    var o = document.createElement('option'); o.value = t; o.textContent = t;
    if (t === q.errorType) o.selected = true;
    typeSel.appendChild(o);
  });
  body.appendChild(h('div', 'field', [h('label', { text: '错误类型' }), typeSel]));

  var kpBox = h('div', { class: 'row wrap' });
  var kpState = { list: (q.knowledgePoints || []).slice() };
  function renderKps() {
    kpBox.textContent = '';
    if (!kpState.list.length) kpBox.appendChild(h('span', { class: 'small muted', text: '未关联知识点' }));
    kpState.list.forEach(function (p) {
      kpBox.appendChild(h('span', { class: 'chip ' + modCls(p.module), text: p.point }));
    });
  }
  renderKps();
  var kpBtn = h('button', { class: 'btn sm', attrs: { type: 'button' }, text: '选择知识点' });
  kpBtn.addEventListener('click', function () {
    pickKnowledgeSheet(kpState.list).then(function (sel) { if (sel != null) { kpState.list = sel; renderKps(); } });
  });
  body.appendChild(h('div', 'field', [h('label', { text: '知识点' }), kpBox, kpBtn]));

  body._collect = function () {
    return {
      id: q.id, createdAt: q.createdAt || Date.now(),
      examName: examIn.value.trim(), questionNo: noIn.value.trim(), questionType: q.questionType || '',
      questionText: qt.value.trim(), imageThumb: q.imageThumb || '',
      userAnswer: ua.value.trim(), correctAnswer: ca.value.trim(),
      errorReason: reason.value.trim(), errorType: typeSel.value,
      knowledgePoints: kpState.list, aiConfidence: q.aiConfidence, source: q.source || 'manual',
      checked: q.checked || false, checkedAt: q.checkedAt || null,
      reviewIntervalIndex: q.reviewIntervalIndex || 0,
      nextReviewAt: q.nextReviewAt || Date.now()
    };
  };
  body._isNew = isNew;
  return body;
}

  if (!DeepSeekClient.hasConfig()) { toast('请先在设置页配置 API Key 或代理地址', 'err'); return; }
  var targets = S.wq.filter(function (q) {

  });
  if (!targets.length) { toast('没有需要归类的错题', 'ok'); return; }
  confirmSheet('批量 AI 归类', '将对 ' + targets.length + ' 道未归类/低置信度错题逐题请求 AI，结果会先展示给你，不会直接写入。', { confirmText: '开始' })
    .then(function (ok) {
      if (!ok) return;
      runBatchClassify(targets);
    });

async function runBatchClassify(list) {
  var okCount = 0, fail = 0;
  for (var i = 0; i < list.length; i++) {
    toast('AI 归类 ' + (i + 1) + '/' + list.length + '…', '', 4000);
    try {
      var res = await aiClassifyQuestion(list[i]);
      list[i]._pendingClassify = res;
      okCount++;
    } catch (e) { fail++; }
    await sleep(300);
  }
  var pending = list.filter(function (q) { return q._pendingClassify; });
  if (!pending.length) { toast('AI 归类全部失败，请检查接口设置', 'err', 3200); return; }
  openBatchReviewSheet(pending, fail);
}

function openBatchReviewSheet(list, failCount) {
  var body = h('div');
  body.appendChild(h('div', { class: 'small muted', style: 'margin-bottom:8px', text: '共 ' + list.length + ' 条 AI 建议' + (failCount ? '（' + failCount + ' 条请求失败）' : '') + '，勾选要保存的建议，可逐条点“改知识点”。' }));
  list.forEach(function (q, i) {
    var res = q._pendingClassify;
    var item = h('div', { class: 'qitem' });
    item.appendChild(h('div', 'row', [
      h('span', { class: 'chip gray', text: '第 ' + (i + 1) + ' 条' }),
      h('span', { class: 'small', style: 'flex:1;min-width:0', math: wqTitle(q) })
    ]));
    var kpRow = h('div', { class: 'row wrap', style: 'margin-top:6px' });
    (res.knowledgePoints || []).forEach(function (p) {
      kpRow.appendChild(h('span', { class: 'chip ' + modCls(p.module), text: p.point }));
    });
    if (!(res.knowledgePoints || []).length) kpRow.appendChild(h('span', { class: 'small muted', text: 'AI 未给出知识点' }));
    item.appendChild(kpRow);
    item.appendChild(h('div', { class: 'small muted', style: 'margin-top:4px', text: '错误类型：' + res.errorType + ' · 置信度 ' + Math.round(res.confidence * 100) + '%' + (res.reason ? ' · ' + res.reason : '') }));
    var selBtn = h('button', { class: 'btn sm', attrs: { type: 'button' }, text: res._keep ? '已选择' : '采用这条' });
    res._keep = true;
    selBtn.textContent = '已选择';
    selBtn.addEventListener('click', function () {
      res._keep = !res._keep;
      selBtn.textContent = res._keep ? '已选择' : '采用这条';
    });
    var editBtn = h('button', { class: 'btn sm', attrs: { type: 'button', }, text: '改知识点' });
    editBtn.addEventListener('click', function () {
      pickKnowledgeSheet(res.knowledgePoints).then(function (sel) {
        if (sel != null) { res.knowledgePoints = sel; kpRow.textContent = ''; sel.forEach(function (p) { kpRow.appendChild(h('span', { class: 'chip ' + modCls(p.module), text: p.point })); }); }
      });
    });
    item.appendChild(h('div', { class: 'row wrap', style: 'margin-top:8px' }, [selBtn, editBtn]));
    body.appendChild(item);
  });
  openSheet({
    title: 'AI 归类建议', body: body,
    buttons: ['cancel', {
      text: '保存到错题本', kind: 'primary', onClick: function (api) {
        var n = 0;
        list.forEach(function (q) {
          var res = q._pendingClassify;
          if (!res || !res._keep) return;
          if ((res.knowledgePoints || []).length) q.knowledgePoints = res.knowledgePoints;
          q.errorType = res.errorType || q.errorType;
          q.aiConfidence = res.confidence;
          if (res.reason && !q.errorReason) q.errorReason = res.reason;
          delete q._pendingClassify;
          n++;
        });
        saveWQ(); touchKnowledge(list.map(function (q) { return q.knowledgePoints || []; }).reduce(function (a, b) { return a.concat(b); }, []));
        api.close(); renderPage(UI.tab);
        toast('已保存 ' + n + ' 条归类结果', 'ok');
      }
    }]
  });
}

function openConfirmClassifySheet(q, res) {
  var body = h('div');
  body.appendChild(h('div', { class: 'small muted', text: '下面是 AI 的归类结果，你可以修改后再保存。' }));
  var kpBox = h('div', { class: 'row wrap', style: 'margin-top:8px' });
  var state = { list: (res.knowledgePoints || []).slice() };
  function renderKps() {
    kpBox.textContent = '';
    if (!state.list.length) kpBox.appendChild(h('span', { class: 'small muted', text: '未给出知识点' }));
    state.list.forEach(function (p) { kpBox.appendChild(h('span', { class: 'chip ' + modCls(p.module), text: p.point })); });
  }
  renderKps();
  var kpBtn = h('button', { class: 'btn sm', attrs: { type: 'button' }, text: '修改知识点' });
  kpBtn.addEventListener('click', function () { pickKnowledgeSheet(state.list).then(function (sel) { if (sel != null) { state.list = sel; renderKps(); } }); });
  body.appendChild(kpBox);
  body.appendChild(kpBtn);

  var typeSel = h('select', 'select');
  ERROR_TYPES.forEach(function (t) {
    var o = document.createElement('option'); o.value = t; o.textContent = t;
    if (t === res.errorType) o.selected = true;
    typeSel.appendChild(o);
  });
  body.appendChild(h('div', 'field', [h('label', { text: '错误类型' }), typeSel]));
  if (res.reason) body.appendChild(h('div', { class: 'small muted', text: '归类理由：' + res.reason }));
  if (res.confidence) body.appendChild(h('div', { class: 'small muted', text: '置信度：' + Math.round(res.confidence * 100) + '%' }));

  openSheet({
    title: 'AI 归类结果', body: body,
    buttons: ['cancel', {
      text: '保存', kind: 'primary', onClick: function (api) {
        q.knowledgePoints = state.list;
        q.errorType = typeSel.value;
        q.aiConfidence = res.confidence;

      var ansBtn = h('button', { class: 'btn sm', attrs: { type: 'button' }, text: gen.open['a' + i] ? '收起答案' : '做完了，对答案' });
      ansBtn.addEventListener('click', function () { gen.open['a' + i] = !gen.open['a' + i]; renderList(); });

      addBtn.addEventListener('click', function () { addExerciseToWrong(q, ex); addBtn.textContent = '已加入'; addBtn.disabled = true; });
      btnRow.appendChild(hintBtn); btnRow.appendChild(ansBtn); btnRow.appendChild(addBtn);
      box.appendChild(btnRow);
      if (gen.open['h' + i] && ex.hint) box.appendChild(h('div', { class: 'ex-h', math: '思路：' + ex.hint }));
      if (gen.open['a' + i]) box.appendChild(h('div', { class: 'ex-a', math: '答案：' + (ex.answer || '（略）') }));
      listWrap.appendChild(box);
    });
    var again = h('button', { class: 'btn block', style: 'margin-top:12px', attrs: { type: 'button' }, text: '再生成一组' });
    again.addEventListener('click', function () { gen.list = null; load(sheetApi.body); });
    listWrap.appendChild(again);
  }

  function setLoading(txt) {
    listWrap.textContent = '';
    listWrap.appendChild(h('div', { class: 'small muted', style: 'padding:14px 0;text-align:center', text: txt }));
  }

  async function load() {
    if (gen.list) { renderList(); return; }
    if (gen.loading) { setLoading('正在生成…'); return; }
    gen.loading = true;
    setLoading('正在准备同类型练手题…');
    var points = (q.knowledgePoints || []).map(function (p) { return p.point; });
    var fromAI = null;
    if (DeepSeekClient.hasConfig()) {
      setLoading('正在调用 AI 生成练习题…');
      try { fromAI = await aiGenerateExercises(q, 2); } catch (e) { fromAI = null; }
    }
    if (fromAI && fromAI.length >= 2) {
      gen.list = fromAI;
      gen.loading = false;
      renderList();
      return;
    }
    setLoading('AI 不可用，正在使用本地模板生成…');
    setTimeout(function () {
      gen.list = generateLocalExercises(points);
      gen.loading = false;
      renderList();
    }, 220);
  }

  var sheetApi = openSheet({
    title: '举一反三练习', body: body,
    buttons: [{ text: '关闭', kind: 'primary', onClick: function (api) { api.close(); } }]
  });

var SVG_NS = 'http://www.w3.org/2000/svg';
function svgEl(tag, attrs) {
  var e = document.createElementNS(SVG_NS, tag);
  for (var k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}
function donutSVG(items, centerTop, centerBottom) {
  var size = 132, cx = 66, cy = 66, r = 46, sw = 16;
  var svg = svgEl('svg', { viewBox: '0 0 ' + size + ' ' + size, width: '100%', height: '132', 'aria-hidden': 'true' });
  svg.appendChild(svgEl('circle', { cx: cx, cy: cy, r: r, fill: 'none', stroke: '#e6e2db', 'stroke-width': sw }));
  var total = items.reduce(function (a, b) { return a + b.value; }, 0);
  if (total > 0) {
    var circ = 2 * Math.PI * r, dashTotal = 0;
    items.forEach(function (it) {
      if (!it.value) return;
      var len = circ * (it.value / total);
      var c = svgEl('circle', {
        cx: cx, cy: cy, r: r, fill: 'none', stroke: it.color, 'stroke-width': sw,
        'stroke-dasharray': len + ' ' + (circ - len),
        'stroke-dashoffset': -dashTotal,
        transform: 'rotate(-90 ' + cx + ' ' + cy + ')',
        'stroke-linecap': 'butt'
      });
      dashTotal += len;
      svg.appendChild(c);
    });
  }
  var t1 = svgEl('text', { x: cx, y: cy - 2, 'text-anchor': 'middle', 'font-size': '22', 'font-weight': '600', fill: '#45443f' });
  t1.textContent = centerTop;
  var t2 = svgEl('text', { x: cx, y: cy + 16, 'text-anchor': 'middle', 'font-size': '11', fill: '#8d8880' });
  t2.textContent = centerBottom;
  svg.appendChild(t1); svg.appendChild(t2);
  return svg;
}

function buildBackup(includeKey) {
  var info;
  try { info = POINT_LIST.length; } catch (e) { info = 0; }
  var out = {
    app: 'math3-wrongbook',
    version: 1,
    exportedAt: new Date().toISOString(),
    data: {
      math3_wrong_questions: S.wq,
      math3_exam_history: S.exam,
      math3_review_queue: S.rev,
      math3_knowledge_progress: S.kp,
      math3_exam_answers: S.ans
    },
    pointsTotal: info
  };
  if (includeKey) {
    out.data.math3_settings = S.set;
  }
  return out;
}
function downloadText(filename, text) {
  try {
    if (window.Bridge && typeof window.Bridge.saveFile === 'function') {
      window.Bridge.saveFile(filename, text);
      return true;
    }
    var blob = new Blob([text], { type: 'application/json;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = filename;
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(url); if (a.parentNode) a.parentNode.removeChild(a); }, 1200);
    return true;
  } catch (e) { return false; }
}
