        api.close();
        if (!okd) showManualCopySheet(name, text);
        else toast('备份文件已生成', 'ok');
      }
    }]
  });
};

function showManualCopySheet(name, text) {
  var body = h('div');
  body.appendChild(h('div', { class: 'small muted', text: '当前环境不支持自动下载。请长按下方文本框全选复制，粘贴到备忘录或其他 App 中保存为 ' + name }));
  var ta = h('textarea', { class: 'textarea', style: 'min-height:220px;font-size:12px' });
  ta.value = text;
  body.appendChild(ta);
  openSheet({ title: '手动复制备份', body: body, buttons: [{ text: '关闭', kind: 'primary', onClick: function (api) { api.close(); } }] });
}

ACTIONS['import'] = function () {
  var input = document.getElementById('fileJson');
  var handler = function () {
    input.removeEventListener('change', handler);
    var f = input.files && input.files[0];
    input.value = '';
    if (!f) return;
    var fr = new FileReader();
    fr.onload = function () {
      var obj = null;
      try { obj = JSON.parse(String(fr.result)); } catch (e) { toast('文件不是合法的 JSON', 'err'); return; }
      var data = obj && obj.data ? obj.data : obj;
      var keys = ['math3_wrong_questions', 'math3_exam_history', 'math3_review_queue', 'math3_knowledge_progress', 'math3_exam_answers'];
      var found = keys.filter(function (k) { return data && data[k] != null; });
      if (!found.length) { toast('没有找到可恢复的数据字段', 'err'); return; }
      confirmImport(data, found, !!data.math3_settings);
    };
    fr.onerror = function () { toast('文件读取失败', 'err'); };
    fr.readAsText(f);
  };
  input.addEventListener('change', handler);
  input.click();
};

function confirmImport(data, found, hasSettings) {
  var body = h('div');
  body.appendChild(h('div', { class: 'small muted', text: '检测到字段：' + found.map(function (k) { return k.replace('math3_', ''); }).join('、') + (hasSettings ? '、settings（含 Key）' : '') }));
  var info = h('div', { class: 'small muted', style: 'margin-top:6px' });
  info.textContent = '错题 ' + ((data.math3_wrong_questions || []).length) + ' 题 · 历史 ' + ((data.math3_exam_history || []).length) + ' 条 · 知识点记录 ' + Object.keys(data.math3_knowledge_progress || {}).length + ' 条。';
  body.appendChild(info);
  openSheet({
    title: '选择恢复方式', body: body,
    buttons: [
      { text: '取消', onClick: function (api) { api.close(); } },
      {
        text: '合并追加', onClick: function (api) {
          api.close();
          doImport(data, false);
        }
      },
      {
        text: '覆盖恢复', kind: 'primary', onClick: function (api) { api.close(); doImport(data, true); }
      }
    ]
  });
}

function doImport(data, overwrite) {
  function arr(v) { return Array.isArray(v) ? v : []; }
  if (overwrite) {
    S.wq = arr(data.math3_wrong_questions);
    S.exam = arr(data.math3_exam_history);
    S.rev = arr(data.math3_review_queue);
    S.kp = (data.math3_knowledge_progress && typeof data.math3_knowledge_progress === 'object') ? data.math3_knowledge_progress : {};
    S.ans = (data.math3_exam_answers && typeof data.math3_exam_answers === 'object') ? data.math3_exam_answers : {};
    if (data.math3_settings && typeof data.math3_settings === 'object') S.set = Object.assign({}, DEFAULT_SETTINGS, data.math3_settings);
    /* 导入的旧配置里可能带别的超时 / 重试值，统一强制为固定值 */
    S.set.timeout = FIXED_TIMEOUT;
    S.set.maxRetries = FIXED_MAX_RETRIES;
  } else {
    var seen = {};
    S.wq.forEach(function (q) { seen[q.id] = 1; });
    arr(data.math3_wrong_questions).forEach(function (q) { if (q && q.id && !seen[q.id]) { S.wq.push(q); seen[q.id] = 1; } });
    var seen2 = {};
    S.exam.forEach(function (r) { seen2[r.id] = 1; });
    arr(data.math3_exam_history).forEach(function (r) { if (r && r.id && !seen2[r.id]) { S.exam.push(r); seen2[r.id] = 1; } });
    S.kp = Object.assign({}, S.kp, data.math3_knowledge_progress || {});
    S.ans = Object.assign({}, S.ans, data.math3_exam_answers || {});
  }
  var ok = true;
  ok = lsSet(K.WQ, S.wq) && ok;
  ok = lsSet(K.EXAM, S.exam) && ok;
  ok = lsSet(K.KP, S.kp) && ok;
  ok = lsSet(K.ANS, S.ans) && ok;
  ok = lsSet(K.SET, S.set) && ok;
  syncReviewQueue();
  processDueReviews();
  UI.genCache = {};
  refresh();
  toast(overwrite ? '已覆盖恢复数据' : '已合并追加数据', 'ok');
}

ACTIONS['clear-progress'] = function () {
  confirmSheet('清空复盘进度', '将重置所有知识点的「未复习 / 学习中 / 已掌握」状态与笔记，错题本身不受影响。', { confirmText: '清空', danger: true })
    .then(function (ok) { if (!ok) return; S.kp = {}; saveKP(); refresh(); toast('已清空知识点复盘进度', 'ok'); });
};
ACTIONS['clear-all'] = function () {
  confirmSheet('清空全部数据', '将删除所有错题、批改历史、知识点笔记与设置（含 API Key）。此操作不可撤销，建议先导出备份。', { confirmText: '我已备份，继续清空', danger: true })
    .then(function (ok) {
      if (!ok) return;
      confirmSheet('再次确认', '真的要清空全部本地数据吗？', { confirmText: '确定清空', danger: true })
        .then(function (ok2) {
          if (!ok2) return;
          [K.WQ, K.EXAM, K.REV, K.KP, K.ANS, K.SET].forEach(lsRemove);
          S.wq = []; S.exam = []; S.rev = []; S.kp = {}; S.ans = {};
          S.set = Object.assign({}, DEFAULT_SETTINGS);
          saveSettings();
          UI.genCache = {};
          UI.exam.draft = null;
          refresh();
          toast('已清空全部数据', 'ok');
        });
    });
};

/* =========================================================
   9. 顶部菜单 / 初始化
   ========================================================= */
ACTIONS['tb-action'] = function () {
  var body = h('div');
  var menu = [
    { text: '手动新增错题', act: 'wrong-add', icon: 'plus' },
    { text: '导出备份', act: 'export', icon: 'down' },
    { text: '导入恢复', act: 'import', icon: 'up' },
    { text: '查看使用说明', act: 'open-help', icon: 'help' }
  ];
  menu.forEach(function (m) {
    var row = h('button', {
      class: 'list-row tap', style: 'width:100%;text-align:left;border:0;background:transparent;color:inherit',
      d: { act: m.act }, attrs: { type: 'button' }
    });
    row.style.borderTop = '1px solid var(--line-soft)';
    row.appendChild(h('span', { style: 'display:flex;color:var(--fg-2)' }, [icon(m.icon)]));
    row.appendChild(h('div', 'lr-main', [h('div', { class: 'lr-title', text: m.text })]));
    row.appendChild(icon('caret'));
    body.appendChild(row);
  });
  openSheet({ title: '快捷操作', body: body, buttons: [{ text: '关闭', onClick: function (api) { api.close(); } }] });
};
ACTIONS['open-help'] = function () {
  closeTopSheet();
  UI.helpOpen = { 0: true, 1: true, 2: true, 3: true, 4: true, 5: true };
  switchTab('set');
};

(function init() {
  try {
    loadAll();
  } catch (e) {
    S.set = Object.assign({}, DEFAULT_SETTINGS);
  }
  MODULE_ORDER.concat(['未分类']).forEach(function (m) {
    if (UI.wrong.collapsedMod['mod:' + m] === undefined) UI.wrong.collapsedMod['mod:' + m] = true;
  });
  try {
    processDueReviews();
  } catch (e) { }
  syncReviewQueue();

  document.getElementById('tbAction').addEventListener('click', function () { ACTIONS['tb-action'](); });

  var due = dueReviewList().length;
  switchTab('home');
  if (due) {
    setTimeout(function () { toast('今天有 ' + due + ' 道错题到期复习', '', 2600); }, 500);
  }

  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) { processDueReviews(); refresh(); }
  });
  window.addEventListener('pageshow', function () { processDueReviews(); });
})();
</script>
